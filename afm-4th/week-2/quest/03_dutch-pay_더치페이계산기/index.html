<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더치페이 계산기 · 하버툴킷</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const won = (n) => n.toLocaleString('ko-KR') + '원';

    // ========================================
    // 🧮 계산 — 배열 / 반복문 / 조건 분기
    // ========================================
    function calculate(people, discountType, discountValue) {
      // 1) 반복문으로 각자 먹은 금액 합계
      const subtotals = [];
      for (let i = 0; i < people.length; i++) {
        let sum = 0;
        for (const item of people[i].items) {
          sum += Number(item.price) || 0;   // 조건 분기: 빈 값·숫자 아님 -> 0
        }
        subtotals.push(sum);
      }

      // 2) 전체 합계
      let total = 0;
      for (const s of subtotals) total += s;

      // 3) 조건 분기: 할인 방식에 따라 할인액 계산
      const value = Number(discountValue) || 0;
      let discount = 0;
      if (discountType === 'percent') {
        discount = Math.floor(total * (value / 100));
      } else {
        discount = value;
      }
      if (discount > total) discount = total;   // 할인이 총액보다 클 수 없다
      if (discount < 0) discount = 0;

      // 4) 먹은 금액에 비례해 할인을 나눠 각자 낼 돈 계산
      const finals = [];
      for (let i = 0; i < subtotals.length; i++) {
        if (total === 0) {
          finals.push(0);                                   // 조건 분기: 0원 나누기 방지
        } else {
          const share = discount * (subtotals[i] / total);
          finals.push(Math.round(subtotals[i] - share));
        }
      }

      // 5) 반올림 후 실제 합계
      let payTotal = 0;
      for (const f of finals) payTotal += f;

      return { subtotals, total, discount, finals, payTotal };
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [people, setPeople] = useState([
        { name: '사람 1', items: [{ name: '', price: '' }] },
        { name: '사람 2', items: [{ name: '', price: '' }] },
      ]);
      const [discountType, setDiscountType] = useState('amount');
      const [discountValue, setDiscountValue] = useState('');

      const r = calculate(people, discountType, discountValue);

      // --- 인원 ---
      const addPerson = () =>
        setPeople([...people, { name: `사람 ${people.length + 1}`, items: [{ name: '', price: '' }] }]);

      const removePerson = (pi) =>
        setPeople(people.filter((_, i) => i !== pi));

      const setName = (pi, name) =>
        setPeople(people.map((p, i) => (i === pi ? { ...p, name } : p)));

      // --- 메뉴 ---
      const addItem = (pi) =>
        setPeople(people.map((p, i) =>
          i === pi ? { ...p, items: [...p.items, { name: '', price: '' }] } : p));

      const removeItem = (pi, ii) =>
        setPeople(people.map((p, i) =>
          i === pi ? { ...p, items: p.items.filter((_, j) => j !== ii) } : p));

      const setItem = (pi, ii, key, value) =>
        setPeople(people.map((p, i) =>
          i === pi
            ? { ...p, items: p.items.map((it, j) => (j === ii ? { ...it, [key]: value } : it)) }
            : p));

      return (
        <main className="max-w-lg mx-auto px-5 py-10">
          <p className="text-xs font-bold tracking-[0.2em] text-indigo-600">하버툴킷</p>
          <h1 className="mt-1 text-2xl font-bold">더치페이 계산기</h1>
          <p className="mt-1 text-sm text-slate-500">
            각자 먹은 메뉴만큼 내고, 할인은 먹은 금액에 비례해 나눕니다.
          </p>

          {/* 인원 + 메뉴 */}
          <div className="mt-8 space-y-3">
            {people.map((person, pi) => (
              <div key={pi} className="bg-white rounded-xl p-4 shadow-sm">
                <div className="flex items-center gap-2">
                  <input
                    value={person.name}
                    onChange={(e) => setName(pi, e.target.value)}
                    aria-label={`${pi + 1}번째 사람 이름`}
                    className="flex-1 font-bold border-b border-slate-200 pb-1
                               focus:outline-none focus:border-indigo-500"
                  />
                  <span className="text-sm font-semibold text-slate-500">
                    {won(r.subtotals[pi])}
                  </span>
                  {people.length > 1 && (
                    <button
                      onClick={() => removePerson(pi)}
                      aria-label={`${person.name} 삭제`}
                      className="w-7 h-7 rounded-full text-slate-400 hover:bg-red-50 hover:text-red-600"
                    >
                      ×
                    </button>
                  )}
                </div>

                <div className="mt-3 space-y-2">
                  {person.items.map((item, ii) => (
                    <div key={ii} className="flex gap-2">
                      <input
                        value={item.name}
                        onChange={(e) => setItem(pi, ii, 'name', e.target.value)}
                        placeholder="메뉴"
                        aria-label="메뉴 이름"
                        className="flex-1 min-w-0 rounded-lg border border-slate-200 px-3 py-1.5 text-sm
                                   focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <input
                        value={item.price}
                        onChange={(e) => setItem(pi, ii, 'price', e.target.value.replace(/[^0-9]/g, ''))}
                        placeholder="금액"
                        inputMode="numeric"
                        aria-label="메뉴 금액"
                        className="w-24 rounded-lg border border-slate-200 px-3 py-1.5 text-sm text-right
                                   focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      {person.items.length > 1 && (
                        <button
                          onClick={() => removeItem(pi, ii)}
                          aria-label="메뉴 삭제"
                          className="w-7 shrink-0 text-slate-400 hover:text-red-600"
                        >
                          ×
                        </button>
                      )}
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => addItem(pi)}
                  className="mt-2 text-xs font-semibold text-indigo-600 hover:underline"
                >
                  + 메뉴 추가
                </button>
              </div>
            ))}
          </div>

          <button
            onClick={addPerson}
            className="mt-3 w-full py-2.5 rounded-xl border-2 border-dashed border-slate-300
                       text-sm font-semibold text-slate-500 hover:border-indigo-400 hover:text-indigo-600"
          >
            + 인원 추가
          </button>

          {/* 할인 */}
          <div className="mt-6 bg-white rounded-xl p-4 shadow-sm">
            <h2 className="font-bold text-sm">할인</h2>
            <div className="mt-3 flex gap-2">
              <div className="flex rounded-lg overflow-hidden border border-slate-200 shrink-0">
                {[['amount', '원'], ['percent', '%']].map(([type, label]) => (
                  <button
                    key={type}
                    onClick={() => setDiscountType(type)}
                    aria-pressed={discountType === type}
                    className={`px-3 py-1.5 text-sm font-semibold ${
                      discountType === type ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
              <input
                value={discountValue}
                onChange={(e) => setDiscountValue(e.target.value.replace(/[^0-9]/g, ''))}
                placeholder={discountType === 'percent' ? '10' : '5000'}
                inputMode="numeric"
                aria-label="할인 값"
                className="flex-1 min-w-0 rounded-lg border border-slate-200 px-3 py-1.5 text-right
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
          </div>

          {/* 결과 */}
          <div className="mt-6 bg-slate-800 text-white rounded-xl p-5">
            <div className="flex justify-between text-sm text-slate-300">
              <span>주문 합계</span>
              <span>{won(r.total)}</span>
            </div>
            <div className="mt-1 flex justify-between text-sm text-slate-300">
              <span>할인</span>
              <span className="text-red-300">− {won(r.discount)}</span>
            </div>

            <div className="mt-3 pt-3 border-t border-slate-600 flex justify-between font-bold text-lg">
              <span>낼 금액</span>
              <span>{won(r.payTotal)}</span>
            </div>

            <ul className="mt-4 pt-4 border-t border-slate-600 space-y-1.5 text-sm">
              {people.map((person, pi) => (
                <li key={pi} className="flex justify-between">
                  <span className="text-slate-300">{person.name || `사람 ${pi + 1}`}</span>
                  <span className="font-semibold">{won(r.finals[pi])}</span>
                </li>
              ))}
            </ul>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
