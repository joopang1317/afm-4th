              </div>
            ))}
          </dl>
        </header>
      );
    }

    function Ingredients() {
      return (
        <Section title="재료">
          <table className="w-full bg-white rounded-xl overflow-hidden shadow-sm">
            <thead>
              <tr className="bg-orange-100 text-left text-sm">
                <th className="px-4 py-2.5">재료</th>
                <th className="px-4 py-2.5 text-right">분량</th>
              </tr>
            </thead>
            <tbody>
              {INGREDIENTS.map(([name, amount]) => (
                <tr key={name} className="border-t border-orange-50">
                  <td className="px-4 py-2.5">{name}</td>
                  <td className="px-4 py-2.5 text-right font-medium">{amount}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Section>
      );
    }

    function Steps() {
      return (
        <Section title="만드는 법">
          <ol className="space-y-5">
            {STEPS.map(([title, time, body], i) => (
              <li key={title} className="flex gap-4">
                <span className="shrink-0 w-8 h-8 rounded-full bg-orange-600 text-white font-bold
                                 flex items-center justify-center">
                  {i + 1}
                </span>
                <div>
                  <h3 className="font-bold">
                    {title}
                    <span className="ml-2 text-xs font-medium text-stone-500">{time}</span>
                  </h3>
                  <p className="mt-1 text-stone-600 leading-relaxed">{body}</p>
                </div>
              </li>
            ))}
          </ol>
        </Section>
      );
    }

    function BulletSection({ title, items }) {
      return (
        <Section title={title}>
          <ul className="space-y-2.5">
            {items.map((item) => (
              <li key={item} className="flex gap-2.5 text-stone-600 leading-relaxed">
                <span className="text-orange-600 font-bold">·</span>
                <span>{item}</span>
              </li>
            ))}
          </ul>
        </Section>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <main className="max-w-2xl mx-auto px-5 py-12">
          <Hero />
          <Ingredients />
          <Steps />
          <BulletSection title="팁" items={TIPS} />
          <BulletSection title="함께 곁들이면 좋은 것" items={SIDES} />
          <footer className="mt-14 pt-6 border-t border-orange-200 text-xs text-stone-400 text-center">
            하버스쿨 AFM 4기 · week-2 quest
          </footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
