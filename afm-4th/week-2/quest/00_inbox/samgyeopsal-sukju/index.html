    /** 2인분 기준 분량을 원하는 인분으로 환산해 문자열로 만든다. */
    function scaleAmount(qty, unit, servings) {
      if (qty === null) return unit;                       // "약간"
      const scaled = (qty * servings) / BASE_SERVINGS;
      const rounded = Math.round(scaled * 100) / 100;
      const text = Number.isInteger(rounded) ? String(rounded) : String(rounded);
      return text + unit;
    }

    function formatClock(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    /** localStorage 와 동기화되는 상태. 접근이 막힌 환경에서도 조용히 메모리로 동작한다. */
    function usePersistentState(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const raw = window.localStorage.getItem(key);
          return raw === null ? initialValue : JSON.parse(raw);
        } catch (e) {
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          /* 사생활 보호 모드 등 — 저장만 건너뛴다 */
        }
      }, [key, value]);

      return [value, setValue];
    }

    /** 현재 화면에 보이는 섹션 id 를 추적한다. */
    function useScrollSpy(ids) {
      const [active, setActive] = useState(ids[0]);

      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries
              .filter((e) => e.isIntersecting)
              .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
            if (visible.length > 0) setActive(visible[0].target.id);
          },
          { rootMargin: '-88px 0px -60% 0px', threshold: 0 }
        );

        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, [ids.join('|')]);

      return active;
    }

    function TimerRing({ elapsed, total }) {
      const R = 26;
      const C = 2 * Math.PI * R;
      const ratio = total === 0 ? 0 : Math.min(1, elapsed / total);

      return (
        <svg viewBox="0 0 64 64" className="h-16 w-16 -rotate-90" aria-hidden="true">
          <circle className="ring-track" cx="32" cy="32" r={R} fill="none" strokeWidth="5" />
          <circle
            className="ring-bar" cx="32" cy="32" r={R} fill="none" strokeWidth="5" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - ratio)}
          />
        </svg>
      );
    }

    function CookTimer({ totalSeconds }) {
      const [elapsed, setElapsed] = useState(0);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return undefined;
        const id = window.setInterval(() => setElapsed((e) => e + 1), 1000);
        return () => window.clearInterval(id);
      }, [running]);

      const over = elapsed > totalSeconds;

      return (
        <Card className="no-print flex items-center gap-4 p-4">
          <div className="relative flex items-center justify-center">
            <TimerRing elapsed={elapsed} total={totalSeconds} />
            <span className="absolute text-[11px] font-bold text-faint">
              {Math.round(Math.min(100, (elapsed / totalSeconds) * 100))}%
            </span>
          </div>

          <div className="min-w-0 flex-1">
            <p className="text-[11px] font-bold uppercase tracking-[0.16em] text-faint">조리 타이머</p>
            <p className={`tnum text-[26px] font-extrabold leading-tight ${over ? 'text-accent' : 'text-ink'}`}>
              {formatClock(elapsed)}

            <p className="text-xs text-faint">

            <Button size="sm" variant={running ? 'secondary' : 'primary'} onClick={() => setRunning((r) => !r)}>
              {running ? '일시정지' : elapsed === 0 ? '시작' : '계속'}
            </Button>
            <Button
              size="sm" variant="ghost" disabled={elapsed === 0}
              onClick={() => { setRunning(false); setElapsed(0); }}
            >
              초기화
            </Button>
          </div>
        </Card>
      );
    }

          {/* 연결선 */}
          {index < STEPS.length - 1 && (
            <span className="absolute left-[15px] top-9 h-[calc(100%-1rem)] w-px bg-line" aria-hidden="true" />
          )}

          <button
            type="button"
            onClick={() => onToggle(!done)}
            aria-pressed={done}
            aria-label={`${index + 1}단계 ${step.title} ${done ? '완료 취소' : '완료 표시'}`}
            className={`no-print absolute left-0 top-0 flex h-8 w-8 items-center justify-center rounded-full
              text-[13px] font-bold transition focus:outline-none focus-visible:ring-2
              focus-visible:ring-accent/40 focus-visible:ring-offset-2 focus-visible:ring-offset-cream
              ${done
                ? 'animate-pop bg-accent text-white'
                : 'bg-white text-muted ring-1 ring-line hover:ring-accent/50 hover:text-accent'}`}
          >
            {done ? (
              <svg viewBox="0 0 16 16" className="h-4 w-4" aria-hidden="true">
                <path d="M2.5 8.5l3.2 3.2 7-7.4" fill="none" stroke="currentColor" strokeWidth="2.4"
                      strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            ) : index + 1}
          </button>

          <div className={`pb-8 transition-opacity ${done ? 'opacity-55' : ''}`}>
            <div className="flex flex-wrap items-baseline gap-x-2.5 gap-y-1">
              <h3 className={`text-[17px] font-bold leading-tight ${done ? 'line-through decoration-line' : ''}`}>
                {step.title}
              </h3>
              <Badge tone={done ? 'done' : 'neutral'}>{step.window}</Badge>
              {step.aside && <span className="text-xs text-faint">{step.aside}</span>}
            </div>

            <p className="mt-2 text-[15px] leading-relaxed text-muted">
              {parts ? (
                <>
                  {parts[0]}
                  <strong className="font-bold text-accent">{step.highlight}</strong>
                  {parts[1]}
                </>
              ) : step.body}
            </p>
          </div>
        </li>
      );
    }

    function StepsSection({ doneSteps, setDoneSteps }) {
      const doneCount = Object.values(doneSteps).filter(Boolean).length;
      const totalSeconds = useMemo(() => STEPS.reduce((sum, s) => sum + s.seconds, 0), []);

      const toggle = useCallback((index, value) => {
        setDoneSteps((prev) => ({ ...prev, [index]: value }));
      }, [setDoneSteps]);

      return (
        <section id="steps" className="scroll-mt-24 bg-white/60 py-12">
          <div className="mx-auto max-w-3xl px-4 sm:px-6">
            <SectionHeading eyebrow="조리" title="만드는 법">
              <Badge tone={doneCount === STEPS.length ? 'done' : 'accent'}>
                {doneCount} / {STEPS.length} 단계
              </Badge>
            </SectionHeading>

            <CookTimer totalSeconds={totalSeconds} />

            <ol className="mt-8">
              {STEPS.map((step, i) => (
                <StepItem
                  key={step.title}
                  index={i}
                  step={step}
                  done={!!doneSteps[i]}
                  onToggle={(v) => toggle(i, v)}
                />
              ))}
            </ol>

            {doneCount === STEPS.length && (
              <Card className="animate-fade-up border-none bg-accent/5 p-5 text-center ring-accent/20">
                <p className="text-base font-bold text-accent">완성입니다 🎉</p>
                <p className="mt-1 text-sm text-muted">
                  뜨거울 때 바로 드세요. 아래 메모에 오늘의 느낌을 남겨두면 다음에 도움이 됩니다.
                </p>
                <Button
                  className="mt-4" size="sm" variant="secondary"
                  onClick={() => setDoneSteps({})}
                >
                  단계 초기화
                </Button>
              </Card>
            )}
          </div>
        </section>
      );
    }

    function TipsSection() {
      return (
        <section id="tips" className="mx-auto max-w-3xl scroll-mt-24 px-4 py-12 sm:px-6">
          <SectionHeading eyebrow="실패하지 않으려면" title="팁" />

          <div className="grid gap-3 sm:grid-cols-2">
            {TIPS.map((tip) => (
              <Card key={tip.title} className="flex gap-3.5 p-4">
                <span aria-hidden="true" className="text-xl leading-none">{tip.icon}</span>
                <div className="min-w-0">
                  <h3 className="text-[15px] font-bold">{tip.title}</h3>
                  <p className="mt-1 text-sm leading-relaxed text-muted">{tip.body}</p>
                </div>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function MemoSection({ memo, setMemo, savedAt, setSavedAt }) {
      const [draft, setDraft] = useState(memo);
      const dirty = draft !== memo;

      // 다른 탭 등에서 memo 가 바뀌면 draft 를 맞춰준다
      useEffect(() => { setDraft(memo); }, [memo]);

      const save = () => {
        setMemo(draft);
        setSavedAt(new Date().toISOString());
      };

      const savedLabel = useMemo(() => {
        if (!savedAt) return null;
        const d = new Date(savedAt);
        if (Number.isNaN(d.getTime())) return null;
        return d.toLocaleString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit',
        });
      }, [savedAt]);

      return (
        <section id="memo" className="mx-auto max-w-3xl scroll-mt-24 px-4 py-12 sm:px-6">
          <SectionHeading eyebrow="기록" title="직접 해보고 남긴 메모" />

          <Card className="overflow-hidden">
            <div className="border-l-4 border-accent p-5">
              <label htmlFor="memo-field" className="block text-sm font-semibold text-muted">
                만들어 본 뒤 느낀 점을 남겨보세요
              </label>
              <textarea
                id="memo-field"
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                rows={6}
                placeholder="불 세기는 어땠는지, 양념은 짰는지 싱거웠는지, 다음엔 무엇을 바꿀지…"
                className="mt-3 w-full resize-y rounded-xl border-0 bg-band/50 p-4 text-[15px] leading-relaxed
                           text-ink placeholder:text-faint/80 ring-1 ring-line
                           focus:outline-none focus:ring-2 focus:ring-accent/40"
              />

              <div className="mt-3 flex flex-wrap items-center justify-between gap-3">
                <p className="text-xs text-faint" aria-live="polite">
                  {dirty
                    ? '저장하지 않은 변경이 있습니다'
                    : savedLabel
                      ? `${savedLabel}에 저장됨`
                      : '아직 저장한 메모가 없습니다'}
                </p>
                <div className="no-print flex gap-2">
                  <Button
                    variant="ghost" size="sm" disabled={!dirty}
                    onClick={() => setDraft(memo)}
                  >
                    되돌리기
                  </Button>
                  <Button size="sm" disabled={!dirty} onClick={save}>
                    저장
                  </Button>
                </div>
              </div>
            </div>
          </Card>

          <p className="mt-3 px-1 text-xs text-faint">
            메모는 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.
          </p>
        </section>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [servings, setServings]     = usePersistentState('ssb:servings', BASE_SERVINGS);
      const [checked, setChecked]       = usePersistentState('ssb:ingredients', {});
      const [doneSteps, setDoneSteps]   = usePersistentState('ssb:steps', {});
      const [memo, setMemo]             = usePersistentState('ssb:memo', '');
      const [savedAt, setSavedAt]       = usePersistentState('ssb:memoSavedAt', null);

      const sectionIds = useMemo(() => SECTIONS.map((s) => s.id), []);
      const active = useScrollSpy(sectionIds);

      const doneCount = Object.values(doneSteps).filter(Boolean).length;

      return (
        <>
          <Header active={active} cookedCount={doneCount} totalSteps={STEPS.length} />

          <main>
            <Hero />
            <IngredientsSection
              servings={servings} setServings={setServings}
              checked={checked} setChecked={setChecked}
            />
            <StepsSection doneSteps={doneSteps} setDoneSteps={setDoneSteps} />
            <TipsSection />
            <MemoSection
              memo={memo} setMemo={setMemo}
              savedAt={savedAt} setSavedAt={setSavedAt}
            />
          </main>

          <Footer />
        </>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
