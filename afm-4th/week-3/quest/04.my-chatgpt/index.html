<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTO — 자동차 주변기기 제품개발 AI</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a21; --panel2:#1d222b; --line:#2a313d;
    --ink:#e8ecf2; --sub:#8d97a8; --accent:#ff7a3d; --accent2:#3ddc97;
    --user:#26456b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}

  /* ── 좌: 프로필 설정 ── */
  aside{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .dot{width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--accent),#ff4d6d);
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .brand h1{margin:0;font-size:17px;letter-spacing:-.01em}
  .brand p{margin:3px 0 0;font-size:11px;color:var(--sub)}

  .sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .sec h2{margin:0 0 9px;font-size:11px;letter-spacing:.1em;color:var(--sub);
    text-transform:uppercase;font-weight:700}

  .presets{display:flex;flex-direction:column;gap:6px}
  .preset{text-align:left;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;
    font-size:12px;transition:.15s}
  .preset:hover{border-color:var(--accent)}
  .preset.on{border-color:var(--accent);background:#2a1d16}
  .preset b{display:block;font-size:12.5px;margin-bottom:2px}
  .preset span{color:var(--sub);font-size:11px}

  label{display:block;font-size:11px;color:var(--sub);margin:9px 0 4px}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:7px;padding:7px 9px;font:inherit;font-size:12.5px;
    resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:10.5px;color:var(--sub);margin-top:8px;line-height:1.5}

  .btn{width:100%;border:none;border-radius:8px;padding:9px;font:inherit;
    font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--accent);color:#1a0d05}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--sub)}

  /* ── 우: 채팅 ── */
  main{display:flex;flex-direction:column;min-width:0}
  .top{padding:12px 22px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .who{font-size:13px;font-weight:700}
  .who em{font-style:normal;color:var(--accent)}
  .stat{font-size:11px;color:var(--sub);white-space:nowrap}
  .stat .ok{color:var(--accent2)}

  .log{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:760px}
  .msg .av{width:28px;height:28px;border-radius:8px;flex:none;font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .msg.ai .av{background:linear-gradient(135deg,var(--accent),#ff4d6d)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .av{background:var(--user)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  .msg.me .bubble{background:var(--user);border-color:#33578a}
  .msg.err .bubble{border-color:#8a3b3b;background:#2a1717;color:#ffb4b4}
  .bubble table{border-collapse:collapse;font-size:12px;margin:6px 0}
  .bubble th,.bubble td{border:1px solid var(--line);padding:4px 8px}

  .empty{margin:auto;text-align:center;color:var(--sub);max-width:420px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent)}

  .composer{border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px}
  .composer textarea{flex:1;min-height:44px;max-height:150px;border-radius:10px;
    padding:11px 13px;font-size:13.5px}
  .send{width:52px;border:none;border-radius:10px;background:var(--accent);
    color:#1a0d05;font-size:18px;cursor:pointer}
  .send:disabled{opacity:.4;cursor:not-allowed}

  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--sub);margin-right:4px;animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{max-height:42vh}
  }
</style>
</head>
<body>
<div class="app">

  <aside>
    <div class="brand">
      <div class="logo">
        <div class="dot">🔧</div>
        <div><h1 id="brandName">PROTO</h1><p id="brandRole">자동차 주변기기 제품개발 AI</p></div>
      </div>
    </div>

    <div class="sec">
      <h2>프로필 프리셋</h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="sec">
      <h2>프로필 직접 설정</h2>
      <label>이름</label>
      <input id="pName" placeholder="프로토">
      <label>성격 · 역할</label>
      <input id="pRole" placeholder="15년차 제품개발 AI">
      <label>말투</label>
      <input id="pTone" placeholder="직설적이고 담백하게">
      <label>전문분야</label>
      <input id="pField" placeholder="차량용 액세서리 기획·설계·양산">
      <label>추가 지침</label>
      <textarea id="pExtra" rows="2" placeholder="예: 항상 예상 원가를 함께 말해줘"></textarea>
      <p class="hint">설정을 바꾸면 다음 메시지부터 반영됩니다.</p>
    </div>

    <div class="sec" style="border:none">
      <button class="btn ghost" id="reset">대화 기록 지우기</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div class="who">지금 대화 상대 · <em id="whoName">PROTO</em></div>
      <div class="stat" id="stat">연결 확인 중…</div>
    </div>

    <div class="log" id="log"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="제품 아이디어나 부품 관련 질문을 입력하세요  (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
      <button class="send" id="send">↑</button>
    </div>
  </main>
</div>

<script>
const SESSION = 's-' + Math.random().toString(36).slice(2, 9);

const PRESETS = [
  { key:'proto', label:'프로토 · 제품개발 AI', desc:'원가·금형·호환성부터 따진다',
    name:'프로토', role:'15년차 자동차 애프터마켓 제품개발 AI',
    tone:'직설적이고 담백하게, 결론부터. 립서비스 없음',
    field:'차량용 액세서리 기획·설계·금형·양산·인증',
    extra:'아이디어에는 반드시 반대 근거를 1개 이상 붙인다.' },
  { key:'senior', label:'박선배 · 깐깐한 사수', desc:'왜 안 되는지부터 말한다',
    name:'박선배', role:'20년차 개발팀 사수. 신입을 굴리는 역할',
    tone:'퉁명스럽지만 결국 답을 준다. 반말 섞인 존대',
    field:'금형 설계, 사출 불량, 협력사 관리',
    extra:'먼저 "그거 해봤어?"로 되묻고, 그다음 구체적 해법을 준다.' },
  { key:'buyer', label:'미스터 바이어 · 유통 담당', desc:'팔리냐 안 팔리냐만 본다',
    name:'미스터 바이어', role:'온라인 커머스 MD 출신 AI',
    tone:'숫자 중심. 마진과 회전율 얘기부터',
    field:'네이버·쿠팡 채널 전략, 가격 설계, 리뷰 관리',
    extra:'모든 답에 예상 판매가와 마진 구조를 언급한다.' },
];

const $ = (id) => document.getElementById(id);
const els = { log:$('log'), input:$('input'), send:$('send') };
let busy = false;

// ── 프로필 ──
function currentProfile(){
  return { name:$('pName').value.trim(), role:$('pRole').value.trim(),
    tone:$('pTone').value.trim(), field:$('pField').value.trim(),
    extra:$('pExtra').value.trim() };
}
function applyPreset(p){
  $('pName').value=p.name; $('pRole').value=p.role; $('pTone').value=p.tone;
  $('pField').value=p.field; $('pExtra').value=p.extra;
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on', b.dataset.key===p.key));
  syncName();
}
function syncName(){
  const n = $('pName').value.trim() || 'PROTO';
  $('whoName').textContent = n; $('brandName').textContent = n;
  $('brandRole').textContent = $('pRole').value.trim() || '자동차 주변기기 제품개발 AI';
}

PRESETS.forEach(p=>{
  const b=document.createElement('button');
  b.className='preset'; b.dataset.key=p.key;
  b.innerHTML='<b>'+p.label+'</b><span>'+p.desc+'</span>';
  b.onclick=()=>applyPreset(p);
  $('presets').appendChild(b);
});
['pName','pRole'].forEach(id=>$(id).addEventListener('input', syncName));
applyPreset(PRESETS[0]);

// ── 렌더 ──
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function addMsg(role, text, isErr){
  emptyOff();
  const d=document.createElement('div');
  d.className='msg '+(role==='me'?'me':'ai')+(isErr?' err':'');
  d.innerHTML='<div class="av">'+(role==='me'?'🙋':'🔧')+'</div><div class="bubble">'+md(text)+'</div>';
  els.log.appendChild(d); els.log.scrollTop=els.log.scrollHeight;
  return d;
}
function addTyping(){
  emptyOff();
  const d=document.createElement('div');
  d.className='msg ai';
  d.innerHTML='<div class="av">🔧</div><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
  els.log.appendChild(d); els.log.scrollTop=els.log.scrollHeight;
  return d;
}
function emptyOff(){ const e=els.log.querySelector('.empty'); if(e) e.remove(); }

function showEmpty(){
  els.log.innerHTML = '<div class="empty"><div class="big">🔧</div>'
    + '<div>제품 아이디어를 던져보세요.<br>원가·금형·차종 호환성부터 따져 드립니다.</div>'
    + '<div class="chips">'
    + ['무선 카플레이 동글, 지금 진입해도 될까?',
       'TPE 카매트 금형비가 얼마나 나오나',
       '차량용 방향제로 차별화가 가능할까?']
      .map(q=>'<button class="chip">'+q+'</button>').join('')
    + '</div></div>';
  els.log.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ els.input.value=c.textContent; send(); });
}
showEmpty();

// ── 전송 ──
async function send(){
  const text = els.input.value.trim();
  if(!text || busy) return;
  busy = true; els.send.disabled = true;
  els.input.value=''; els.input.style.height='auto';
  addMsg('me', text);
  const typing = addTyping();

  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, sessionId:SESSION, profile:currentProfile() })
    });
    const j = await r.json();
    typing.remove();
    if(j.success) addMsg('ai', j.data.reply);
    else addMsg('ai', '⚠️ ' + (j.message || '오류가 발생했습니다.'), true);
  }catch(e){
    typing.remove();
    addMsg('ai', '⚠️ 서버에 연결하지 못했습니다. ' + e.message, true);
  }finally{
    busy = false; els.send.disabled = false; els.input.focus();
  }
}

els.send.onclick = send;
els.input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
els.input.addEventListener('input', ()=>{
  els.input.style.height='auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 150) + 'px';
});

$('reset').onclick = async ()=>{
  await fetch('/api/reset?sessionId='+SESSION, { method:'POST' });
  showEmpty();
};

// ── 상태 ──
fetch('/api/health').then(r=>r.json()).then(j=>{
  const d=j.data||{};
  $('stat').innerHTML = d.hasKey
    ? '<span class="ok">● 연결됨</span> · ' + d.model
    : '<span style="color:#ff8b8b">● API 키 없음</span>';
}).catch(()=>{ $('stat').textContent='서버 응답 없음'; });
</script>
</body>
</html>
